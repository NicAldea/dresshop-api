spring.application.name=dresshop-api
server.port=${PORT : 8080}

#Lee claves secretas desde el .env (Que no se sube a github)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:h2:mem:dresshop}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

app.cors.origins=http://localhost:5173,https://tienda-ropa-chi-six.vercel.app
